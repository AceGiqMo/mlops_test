services:                      # list of application containers
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.0
    command: server --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow-data        # named volume: data survives between runs
    environment:
      - MLFLOW_BACKEND_STORE_URI=sqlite:////mlflow-data/mlflow.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  iris-api:
    image: ${FULL_IMAGE_NAME}   # tag extracted from the env
    ports:
      - "8000:8000"
    environment:
      - ENV=prod
      - API_KEY=${API_KEY}
      - MLFLOW_URI=http://mlflow:5000   # service name = DNS-name inside the compose net
      - MODEL_NAME=iris-model
      - MODEL_NAME=${MODEL_NAME:-iris-model}
      - MODEL_VERSION=${MODEL_VERSION:-latest}
    depends_on:
      mlflow:
        condition: service_healthy      # start only of mlflow is healthy
    restart: always

volumes:
  mlflow-data: