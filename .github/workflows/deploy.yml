name: deploy

on:
  workflow_run:
    workflows: ["train"] # Exact name of your first workflow
    types:
      - completed

jobs:
  build:
    runs-on: ubuntu-latest
    # Optional: Ensure it only runs if the first workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}   # отдаём имя образа дальше
    steps:
      - name: Compute lowercase image name
        id: image
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$OWNER/iris-api" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest

  deploy:
    needs: build
    runs-on: self-hosted
    environment: production
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v4        # downloads the whole repository, including docker-compose.yml

      - name: Deploy stack
        env:
          IMAGE_TAG: ${{ github.sha }}   # transferred into docker-compose.yml as ${IMAGE_TAG}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          docker compose pull            # скачивает образы (iris-api с новым тегом, mlflow если его нет)
          docker compose up -d           # создаёт/пересоздаёт контейнеры по описанию в docker-compose.yml
          docker compose ps              # показывает статус всех сервисов