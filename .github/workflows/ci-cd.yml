name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Ensure MLflow is running
        run: |
          python3.14 -m venv .venv
          if ! curl -s http://localhost:5000/health > /dev/null; then
            echo "MLflow not running, starting..."
            docker run -d -p 5000:5000 \
            -v /tmp/mlflow-data:/mlflow-data \
            -e MLFLOW_BACKEND_STORE_URI=sqlite:////mlflow-data/mlflow.db \
            ghcr.io/mlflow/mlflow:v3.16.0 \
            mlflow server --host 0.0.0.0 --port 5000
            sleep 10  # даём MLflow время подняться
          fi

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Train model
        run: |
          source .venv/bin/activate
          python train.py

      - name: Model quality gate
        run: |
          source .venv/bin/activate
          python check_model.py

      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest test_main.py -v

  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}   # отдаём имя образа дальше
    steps:
      - name: Compute lowercase image name
        id: image
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$OWNER/iris-api" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    environment: production
    permissions:
      packages: read
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy stack
        env:
          IMAGE_TAG: ${{ github.sha }}   # transferred into docker-compose.yml as ${IMAGE_TAG}
          API_KEY: ${{ secrets.API_KEY }}
          FULL_IMAGE_NAME: "${{ needs.build.outputs.image }}:${{ github.sha }}"
        run: |
          docker compose pull            # скачивает образы (iris-api с новым тегом, mlflow если его нет)
          docker compose up -d           # создаёт/пересоздаёт контейнеры по описанию в docker-compose.yml
          docker compose ps              # показывает статус всех сервисов
