name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx
          
      - name: Train model
        run: python train.py

      - name: Model quality gate
        run: python check_model.py

      - name: Run tests
        run: pytest test_main.py -v

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: model.pkl

  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: model

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/iris-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/iris-api:latest

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    environment: production
    permissions:
      packages: read
    steps:
#      - name: Deploy via SSH
#        uses: appleboy/ssh-action@v1.0.3
#        with:
#          host: ${{ secrets.DEPLOY_HOST }}
#          username: ${{ secrets.DEPLOY_USER }}
#          key: ${{ secrets.DEPLOY_SSH_KEY }}
#          script: |
#            docker pull ghcr.io/${{ github.repository_owner }}/iris-api:${{ github.sha }}
#            docker stop iris-api || true
#            docker rm iris-api || true
#            docker run -d --name iris-api --restart=always \
#              -p 8000:8000 -e ENV=prod -e API_KEY=${{ secrets.API_KEY }} \
#              ghcr.io/${{ github.repository_owner }}/iris-api:${{ github.sha }}
      - name: Pull and run
        run: |
          docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ghcr.io/${{ github.repository_owner }}/iris-api:${{ github.sha }}
          docker stop iris-api || true
          docker rm iris-api || true
            docker run -d --name iris-api --restart=always \
              -p 8000:8000 -e ENV=prod -e API_KEY=${{ secrets.API_KEY }} \
              ghcr.io/${{ github.repository_owner }}/iris-api:${{ github.sha }}

