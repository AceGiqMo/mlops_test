name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: Install dependencies
        run: |
          cd /Users/acegiqmo/Desktop/PL/Python/mlops_test
          source .venv/bin/activate
          .venv/bin/pip3.14 install -r requirements.txt
          .venv/bin/pip3.14 install pytest httpx

      - name: Train model
        run: |
          cd /Users/acegiqmo/Desktop/PL/Python/mlops_test
          python train.py

      - name: Model quality gate
        run: |
          cd /Users/acegiqmo/Desktop/PL/Python/mlops_test
          python check_model.py

      - name: Run tests
        run: |
          cd /Users/acegiqmo/Desktop/PL/Python/mlops_test
          pytest test_main.py -v

  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}   # отдаём имя образа дальше
    steps:
      - name: Compute lowercase image name
        id: image
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$OWNER/iris-api" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    environment: production
    permissions:
      packages: read
    steps:
      - name: Deploy stack
        env:
          IMAGE_TAG: ${{ github.sha }}   # transferred into docker-compose.yml as ${IMAGE_TAG}
          API_KEY: ${{ secrets.API_KEY }}
          FULL_IMAGE_NAME: "${{ needs.build.outputs.image }}:${{ github.sha }}"
        run: |
          docker compose pull            # скачивает образы (iris-api с новым тегом, mlflow если его нет)
          docker compose up -d           # создаёт/пересоздаёт контейнеры по описанию в docker-compose.yml
          docker compose ps              # показывает статус всех сервисов
