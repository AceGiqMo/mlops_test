name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx
          
      - name: Train model
        run: python train.py

      - name: Model quality gate
        run: python check_model.py

      - name: Run tests
        run: pytest test_main.py -v

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: model.pkl

  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}   # отдаём имя образа дальше
    steps:
      - name: Compute lowercase image name
        id: image
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$OWNER/iris-api" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: model

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    environment: production
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v4        # downloads the whole repository, including docker-compose.yml

      - name: Deploy stack
        env:
          IMAGE_TAG: ${{ github.sha }}   # transferred into docker-compose.yml as ${IMAGE_TAG}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          docker compose pull            # скачивает образы (iris-api с новым тегом, mlflow если его нет)
          docker compose up -d           # создаёт/пересоздаёт контейнеры по описанию в docker-compose.yml
          docker compose ps              # показывает статус всех сервисов

